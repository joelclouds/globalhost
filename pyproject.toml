[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalhost"
version = "0.1.0"
authors = [
    { name = "Joel Opoku", email = "joelclouds@gmail.com" }
]
description = "Turn any machine into a public server instantly with automated zero-config tunnels."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "uvicorn>=0.22.0",
]

[project.urls]
"Homepage" = "https://github.com/joelclouds/globalhost"

[tool.setuptools.packages.find]
where = ["src"]
