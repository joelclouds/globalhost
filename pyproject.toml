[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalhost"
version = "0.3.1"
authors = [
    { name = "Joel Opoku", email = "joelclouds@gmail.com" }
]
description = "Turn any machine into a public server instantly with automated zero-config tunnels."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Zero runtime dependencies! The core package uses only the Python standard library.
dependencies = []

[project.urls]
"Homepage" = "https://github.com/joelclouds/globalhost"

# Optional dependencies for specific frameworks
[project.optional-dependencies]
fastapi = ["fastapi", "uvicorn"]
django = ["django"]
flask = ["flask"]
streamlit = ["streamlit"]
# Users can install everything at once with: pip install globalhost[all]
all = ["fastapi", "uvicorn", "django", "flask", "streamlit"]

[tool.setuptools.packages.find]
where = ["src"]
